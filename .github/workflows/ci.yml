name: Mevo backend and account CI

on:
  push:
    branches:
      - main
      - feature/mevo-commerce-os-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # The repository's existing bun.lock predates the current package.json; refresh it in CI.
        run: bun install

      - name: TypeScript validation
        run: bun run lint

      - name: Automated tests
        run: bun run test

      - name: Production build
        run: bun run build
